<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 476" width="800" height="476" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12"><rect width="800" height="476" rx="8" fill="#ffffff"/><text x="20" y="30" font-size="16" font-weight="600" fill="#1f1f1d">UltraHonk proves faster than Groth16 on all five platforms</text><text x="20" y="50" fill="#5f5f5a">Time per redemption on the prover side, seconds (witness generation + proof generation)</text><rect x="20" y="64" width="12" height="10" fill="#bdbcb0" fill-opacity=".45"/><text x="38" y="73" fill="#5f5f5a">witness</text><rect x="100" y="64" width="12" height="10" fill="#bdbcb0"/><text x="118" y="73" fill="#5f5f5a">proof</text><rect x="170" y="64" width="12" height="10" fill="#2b78d4"/><text x="188" y="73" fill="#5f5f5a">UltraHonk (blue) vs Groth16 (grey)</text><text x="176" y="114" text-anchor="end" font-weight="600" fill="#1f1f1d">Laptop</text><text x="176" y="130" text-anchor="end" fill="#5f5f5a" font-size="11">Intel i5-11400H</text><line x1="190" x2="190" y1="96" y2="146" stroke="#9a9a92"/><rect x="190" y="98" width="9.3" height="21" fill="#bdbcb0" fill-opacity=".45"/><rect x="199.3" y="98" width="127.5" height="21" fill="#bdbcb0"/><text x="334.8" y="113" fill="#1f1f1d">0.86 s</text><rect x="190" y="123" width="42.1" height="21" fill="#2b78d4" fill-opacity=".45"/><rect x="232.1" y="123" width="67.3" height="21" fill="#2b78d4"/><text x="307.4" y="138" fill="#1f1f1d">0.68 s</text><text x="780" y="136" text-anchor="end" fill="#5f5f5a" font-size="11">1.9× faster proof</text><text x="176" y="184" text-anchor="end" font-weight="600" fill="#1f1f1d">Desktop</text><text x="176" y="200" text-anchor="end" fill="#5f5f5a" font-size="11">Intel i7-14700</text><line x1="190" x2="190" y1="166" y2="216" stroke="#9a9a92"/><rect x="190" y="168" width="6.6" height="21" fill="#bdbcb0" fill-opacity=".45"/><rect x="196.6" y="168" width="94.0" height="21" fill="#bdbcb0"/><text x="298.6" y="183" fill="#1f1f1d">0.63 s</text><rect x="190" y="193" width="32.6" height="21" fill="#2b78d4" fill-opacity=".45"/><rect x="222.6" y="193" width="46.9" height="21" fill="#2b78d4"/><text x="277.5" y="208" fill="#1f1f1d">0.50 s</text><text x="780" y="206" text-anchor="end" fill="#5f5f5a" font-size="11">2.0× faster proof</text><text x="176" y="254" text-anchor="end" font-weight="600" fill="#1f1f1d">Server</text><text x="176" y="270" text-anchor="end" fill="#5f5f5a" font-size="11">AMD EPYC 9754, 128 cores</text><line x1="190" x2="190" y1="236" y2="286" stroke="#9a9a92"/><rect x="190" y="238" width="12.3" height="21" fill="#bdbcb0" fill-opacity=".45"/><rect x="202.3" y="238" width="186.0" height="21" fill="#bdbcb0"/><text x="396.3" y="253" fill="#1f1f1d">1.24 s</text><rect x="190" y="263" width="64.6" height="21" fill="#2b78d4" fill-opacity=".45"/><rect x="254.6" y="263" width="58.7" height="21" fill="#2b78d4"/><text x="321.3" y="278" fill="#1f1f1d">0.77 s</text><text x="780" y="276" text-anchor="end" fill="#5f5f5a" font-size="11">3.2× faster proof</text><text x="176" y="324" text-anchor="end" font-weight="600" fill="#1f1f1d">Jetson Orin Nano</text><text x="176" y="340" text-anchor="end" fill="#5f5f5a" font-size="11">ARM64, 15 W</text><line x1="190" x2="190" y1="306" y2="356" stroke="#9a9a92"/><rect x="190" y="308" width="28.8" height="21" fill="#bdbcb0" fill-opacity=".45"/><rect x="218.8" y="308" width="396.5" height="21" fill="#bdbcb0"/><text x="623.3" y="323" fill="#1f1f1d">2.66 s</text><rect x="190" y="333" width="122.5" height="21" fill="#2b78d4" fill-opacity=".45"/><rect x="312.5" y="333" width="117.2" height="21" fill="#2b78d4"/><text x="437.8" y="348" fill="#1f1f1d">1.50 s</text><text x="780" y="346" text-anchor="end" fill="#5f5f5a" font-size="11">3.4× faster proof</text><text x="176" y="394" text-anchor="end" font-weight="600" fill="#1f1f1d">Raspberry Pi 5</text><text x="176" y="410" text-anchor="end" fill="#5f5f5a" font-size="11">ARM64, thermally throttled*</text><line x